[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Netlify 는 빌드 Node 버전을 사이트 생성 시점의 기본값으로 고른다. 저장소가
  # 버전을 적어 두지 않으면 로컬에서 되는 빌드가 여기서만 깨진다 —
  # vite 8 과 @vitejs/plugin-react 6 은 Node 20.19+, vitest 5 는 22.12+ 를 요구해
  # 기본값이 그보다 낮으면 tsc 를 지나 vite 단계에서 죽는다. .nvmrc 와 같은 값이다.
  NODE_VERSION = "22"

  # 시크릿 스캐너가 빌드 산출물에서 찾으면 배포를 세우는 키 목록에서 뺄 이름들.
  # VITE_ 로 시작하는 두 값은 브라우저가 Supabase 를 부르려면 번들에 박혀야 하는
  # 공개 키다(anon 키는 RLS 로 막는 전제로 설계돼 있다). 유출이 아니라 설계이므로
  # 스캐너에 예외로 알려 준다. 서버 키(SUPABASE_SERVICE_ROLE_KEY 등)는 여기
  # 넣지 말 것 — 그건 번들에 들어가면 안 되고, 스캐너가 잡아 주어야 한다.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# 공개 앱 도메인에서는 관리자 번들과 경로를 노출하지 않는다. SPA catch-all보다
# 먼저 평가되며, public/404.html을 실제 404 응답으로 반환한다.
[[redirects]]
  from = "https://veroro-app.netlify.app/admin"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://veroro-app.netlify.app/admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
