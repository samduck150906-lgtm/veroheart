<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/veroro-logo.png" />
    <link rel="apple-touch-icon" href="/veroro-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-veroro-meta="title">베로로</title>
    <meta data-veroro-meta="description" name="description" content="반려동물 제품의 원료와 영양 정보를 확인하세요." />
    <link data-veroro-meta="canonical" rel="canonical" href="https://veroro-app.netlify.app/" />
    <script id="veroro-product-jsonld" type="application/ld+json">{}</script>
    <!-- 디자인 시스템 서체는 Pretendard 단일 스택 (src/index.css에서 @import) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 테마 무플래시 초기화 — React 마운트 전에 data-theme 적용
      (function () {
        try {
          var saved = localStorage.getItem('vh_theme'); // 'light' | 'dark' | 'system' | null
          var mode = saved || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
