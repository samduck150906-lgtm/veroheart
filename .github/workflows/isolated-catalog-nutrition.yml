name: Isolated catalog and nutrition integration
on:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc -p tests/browser-fixture/tsconfig.json
      - run: npx vite build --config tests/browser-fixture/vite.config.ts
      - run: node tests/browser-fixture/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-browser-evidence
          path: .artifacts/browser-results
