name: Release checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci
      - run: npm run lint
      - name: Capacitor rimraf dependency compatibility
        run: node --test scripts/rimraf-compatibility.test.mjs
      - name: Product cleanup safety regression
        run: npm run test:product-cleanup-safety
      - name: Nutrition evidence regression
        run: node --experimental-vm-modules --test scripts/feed-nutrition-evidence.test.mjs
      - name: Conditional review privacy SQL and role regression
        run: npm run test:review-privacy
      - name: Label review server type contract
        run: npx tsc --noEmit --target ES2023 --module esnext --moduleResolution bundler --allowImportingTsExtensions --skipLibCheck supabase/functions/admin-write/labelReview.ts
      - name: Label review service synthetic flow
        run: node --experimental-vm-modules --test scripts/label-review-service.test.mjs
      - run: npm test
      - run: npm run test:catalog
      - run: npm run test:bootstrap -- --label-comparison-draft
      - run: npm run test:schemas
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npm ci
        working-directory: landing
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: landing
      - run: npm audit --audit-level=moderate
        working-directory: landing

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.13.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci && npm run build && npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug assembleRelease
        working-directory: android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.13.0
      - run: npm ci && npm run build && npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
