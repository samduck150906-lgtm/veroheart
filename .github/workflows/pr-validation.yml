name: PR validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: purchase_link_contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d purchase_link_contract_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Same workflow path/shape as the unmerged cleanup-safety PR; preserve its optional step.
      - name: Existing cleanup safety tests when present
        run: |
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.["test:product-cleanup-safety"] ? 0 : 1)'; then
            npm run test:product-cleanup-safety
          fi
      - run: npm run test:purchase-links
      - name: PostgreSQL two-connection locking tests (disposable local service only)
        run: npm run test:purchase-links:concurrency
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: synthetic-ci-only
          PGDATABASE: purchase_link_contract_test
      - name: Related Vitest regression
        run: npx vitest run src/lib/adminWriteValidation.test.ts src/lib/productCleanupServerContract.test.ts src/lib/migrationLedgerReconciliation.test.ts
      - run: npm test -- --run
      - name: App and server validation type checks
        run: |
          npx tsc -b --pretty false
          npx tsc --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler --allowImportingTsExtensions --skipLibCheck supabase/functions/admin-write/purchaseLinks.ts
      - run: npx eslint --no-ignore supabase/functions/admin-write/purchaseLinks.ts
      - run: npm run build
      - run: git diff --exit-code && git diff --check
